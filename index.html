:root{

  --warn:#8F5A0E; --warn-bg:#F5E1B3; --bad:#A3301F; --bad-bg:#F3D5CB;
  --c1:#5A331A; --c2:#7E97A8; --c3:#D4951A; --c4:#B5573A; --c5:#3B6A44; --c6:#A8977A;

}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;

h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom,0px))}

.brand{flex:1;min-width:0}
.brand b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;letter-spacing:.04em;line-height:1}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-family:var(--f-body);font-weight:700;margin:22px 2px 10px}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--surface2);color:var(--ink)}
.pill.ok{background:var(--leaf-bg);color:var(--leaf)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill .ic{width:14px;height:14px;stroke-width:2.2}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed="1"]{background:var(--bad);color:var(--surface)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 auto}

/* parcours */
.flow{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr 18px 1fr;align-items:start}
.fstep{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0;background:none;border:0;padding:0}
.fnode{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1.5px solid var(--line);position:relative}
.fnode.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.fstep b{font-size:12.5px;line-height:1.15}
.fstep small{font-size:11.5px;color:var(--muted);line-height:1.2}
.fstep .cnt{font-family:var(--f-mono);font-size:13px;font-weight:500}
.farrow{display:grid;place-items:center;height:52px;color:var(--gold)}
.farrow .ic{width:16px;height:16px}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{display:block;font-family:var(--f-mono);font-weight:500;font-size:16px;margin-top:2px;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted)}

.alert{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.alert.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.alert.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.alert .t{flex:1;min-width:0}
.alert b{display:block;color:var(--ink)}
.alert.warn b,.alert.bad b{color:inherit}
.alert .btn{min-height:36px;padding:0 12px;font-size:13px;background:transparent;color:inherit;border-color:currentColor}

/* bocaux */
.jar-top{display:flex;gap:12px}
.thumb{width:76px;height:76px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;color:var(--muted);flex:none}
.thumb img{width:100%;height:100%;object-fit:contain;display:block}
.jar-main{min-width:0;flex:1}
.jar-main h3{font-size:18px;line-height:1.15;overflow-wrap:anywhere}
.jar-main .sub{font-size:13px;color:var(--muted);margin:2px 0 6px}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px}
.prog.late i{background:var(--bad)}
.prog.soon i{background:var(--gold)}
.dates{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-top:5px}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.kv div{min-width:0}
.kv small{display:block;font-size:12px;color:var(--muted)}
.kv b{font-family:var(--f-mono);font-weight:500;font-size:13px;overflow-wrap:anywhere}
details.bk{margin-top:8px;font-size:13.5px}
details.bk summary{cursor:pointer;color:var(--muted);min-height:32px;display:flex;align-items:center}
.lines{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.lines div{display:flex;justify-content:space-between;gap:8px}
.lines .tot{border-top:1px dashed var(--line);padding-top:5px;font-weight:700}

/* formulaires */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--muted)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);min-height:46px;padding:0 12px;gap:8px}
.inp:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;border:0;background:transparent;outline:0;padding:10px 0}
.inp select{background:var(--bg)}
.inp em{font-style:normal;color:var(--muted);font-size:13px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;min-height:40px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.recap{background:var(--surface2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.recap .r{display:flex;justify-content:space-between;gap:10px}
.recap .r b{font-family:var(--f-mono);font-weight:500;text-align:right}
.recap .h{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:4px}
.photo{display:flex;gap:12px;align-items:center}
.photo .thumb{width:84px;height:84px}
.fmtrow{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.fmtrow.off{opacity:.55}
.fmtrow h4{margin:0;font-family:var(--f-display);font-size:16px}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center}
.stepper button:disabled{opacity:.3}
.stepper b{min-width:32px;text-align:center;font-family:var(--f-mono);font-weight:500}
.stepper.sm button{width:38px;height:38px}

/* stock & boutique */
.lot{display:flex;gap:12px}
.lot .thumb{width:72px;height:72px}
.lot h3{font-size:16px;line-height:1.15}
.lot .meta{flex:1;min-width:0}
.price{font-family:var(--f-mono);font-weight:500}
.prods{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{display:flex;flex-direction:column;gap:8px;padding:10px;min-width:0}
.prod .img{aspect-ratio:4/3;max-width:100%;border-radius:12px;background:var(--surface2);overflow:hidden;display:grid;place-items:center;color:var(--muted);position:relative}
.prod .img img{width:100%;height:100%;object-fit:contain}
.prod .badge{position:absolute;left:8px;top:8px;background:var(--accent);color:var(--on-accent);font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px}
.prod h3{font-size:15px;line-height:1.15;overflow-wrap:anywhere}
.prod .price{font-size:17px}
.prod.out{opacity:.5}
.cartbar{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));z-index:20;pointer-events:none}
.cartbar>div{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--on-accent);border-radius:16px;padding:10px 10px 10px 16px;box-shadow:var(--shadow);pointer-events:auto}
.cartbar .t{flex:1;min-width:0}
.cartbar .t b{display:block;font-family:var(--f-mono);font-weight:500;font-size:17px}
.cartbar .btn{background:var(--on-accent);color:var(--accent);border-color:transparent}

/* tableau de bord historique */
.bars{display:flex;align-items:flex-end;gap:4px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.bars i{flex:1;background:var(--leaf);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.bars i.z{background:var(--surface2)}
.baxis{display:flex;gap:4px;margin-top:4px}
.baxis span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--muted);text-align:right;font-weight:600;padding:6px 4px}
th:first-child,td:first-child{text-align:left}
td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
.tbl{overflow-x:auto}
.sale{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.sale .m{flex:1;min-width:0}
.sale b{display:block}

/* suivi par bocal */
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:12px;position:relative}
.track::before{content:"";position:absolute;left:12.5%;right:12.5%;top:15px;height:2px;background:var(--line)}
.tn{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px;color:var(--muted);min-width:0}
.tn i{width:32px;height:32px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);position:relative}
.tn.done i{background:var(--leaf);border-color:var(--leaf);color:var(--surface)}
.tn.cur i{border-color:var(--gold);color:var(--gold)}
.tn.done{color:var(--ink)}
.tn .ic{width:16px;height:16px;stroke-width:2.2}
.stamp{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--leaf);color:var(--leaf);border-radius:8px;padding:2px 9px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;transform:rotate(-3deg)}
.stamp .ic{width:14px;height:14px;stroke-width:2.6}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:54px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--accent);background:var(--surface2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button[aria-current="page"]{color:var(--gold)}}
:root[data-theme="dark"] .tabs button[aria-current="page"]{color:var(--gold)}

/* feuilles */
.wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(20,10,4,.55)}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;box-shadow:0 -20px 50px -20px rgba(0,0,0,.6);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet>header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px max(16px,env(safe-area-inset-left,0px)) 8px}
.sheet>header h2{font-size:20px}
.sheet .body{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet footer{padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
.paper{background:#fff;color:#161616;font-family:var(--f-mono);font-size:12.5px;line-height:1.4;white-space:pre;overflow-x:auto;padding:16px 14px;border-radius:6px;box-shadow:var(--shadow);margin:0}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .logo{width:84px;height:84px;opacity:.9}
.empty h3{font-size:20px}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:14px}
.banner b{color:inherit}
.banner .btn{background:transparent;color:inherit;border-color:currentColor;min-height:36px;padding:0 12px;font-size:13px}
@media (max-width:370px){.grid3{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.fstep small{display:none}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}

/* ===== couleur par produit (bocal) ===== */
:root{--h0:#C0563A;--h1:#2F8F6B;--h2:#3E7CB1;--h3:#D49A1C;--h4:#8E5BB5;--h5:#C74F7C;--h6:#4B9AA0;--h7:#7E8F2F}
.tint{background:color-mix(in srgb,var(--hue,var(--line)) 17%,var(--surface));border-color:color-mix(in srgb,var(--hue,var(--line)) 45%,var(--line));border-left:6px solid var(--hue,var(--line))}
.tint .thumb,.tint .prod .img,.tint .img{background:color-mix(in srgb,var(--hue,var(--line)) 14%,var(--surface2))}
.tint .prog{background:color-mix(in srgb,var(--hue,var(--line)) 18%,var(--surface2))}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hue);margin-right:6px;vertical-align:baseline}
/* ===== v2 : fluidité et détail ===== */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes down{to{transform:translateY(100%);opacity:.4}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes dash{from{stroke-dashoffset:var(--c)}}
#view.enter>*{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
#view.enter>*:nth-child(2){animation-delay:.04s}#view.enter>*:nth-child(3){animation-delay:.08s}
#view.enter>*:nth-child(4){animation-delay:.12s}#view.enter>*:nth-child(5){animation-delay:.16s}
#view.enter>*:nth-child(6){animation-delay:.2s}#view.enter>*:nth-child(7){animation-delay:.24s}
#view.enter>*:nth-child(8){animation-delay:.28s}#view.enter>*:nth-child(n+9){animation-delay:.32s}
#view.enter .prog i{animation:grow .9s cubic-bezier(.2,.7,.2,1) .15s both;transform-origin:left}
#view.enter .bars i{animation:growy .7s ease-out .1s both;transform-origin:bottom}
.card,.btn,.chip,.sale,.fstep,.tabs button,.stepper button,.iconbtn{transition:transform .15s ease,background-color .2s,color .2s,border-color .2s,box-shadow .2s}
.btn:active,.chip:active,.sale:active,.fstep:active,.tabs button:active,.iconbtn:active{transform:scale(.96)}
.stepper button:active{background:var(--surface2)}
.scrim{animation:fade .2s ease-out}
.wrap.closing{pointer-events:none}
.wrap.closing .sheet{animation:down .19s ease-in forwards}
.wrap.closing .scrim{opacity:0;transition:opacity .19s}
.cartbar>div{animation:rise .3s cubic-bezier(.2,.7,.2,1)}
.sheet>header{position:relative;touch-action:none}
.sheet>header::before{content:"";position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--line);transform:translateX(-50%)}
.sheet.tall{height:94%}
.jar-top{background:none;border:0;padding:0;text-align:left;width:100%;color:inherit}
.dsec{font-size:13px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-family:var(--f-body);font-weight:700;margin:8px 0 -4px}
.hero{aspect-ratio:16/9;max-width:100%;border-radius:16px;background:var(--surface2);overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.hero img{width:100%;height:100%;object-fit:contain;display:block}
.dtop{display:flex;gap:14px;align-items:center}
.dtop>div{min-width:0}
.dtop h3{font-size:20px;line-height:1.15;overflow-wrap:anywhere}
.ringsvg{width:128px;height:128px;flex:none}
.rb{fill:none;stroke:var(--surface2);stroke-width:9}
.rg{fill:none;stroke-width:9;stroke-linecap:round;animation:dash 1s cubic-bezier(.2,.7,.2,1) both}
.rt{font:800 22px var(--f-display);fill:var(--ink);text-anchor:middle}
.rs{font:600 8.5px var(--f-body);fill:var(--muted);text-anchor:middle}
.comp{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface2)}
.comp i{display:block;min-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.ing{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ing:first-child{border-top:0}
.ing i{width:10px;height:10px;border-radius:50%;flex:none}
.ing .n{flex:1;min-width:0}
.ing .n small{display:block;color:var(--muted);font-size:12.5px}
.vt{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:14px}
.vt li{position:relative;padding-left:14px}
.vt li::before{content:"";position:absolute;left:-21px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.vt li.done::before{background:var(--leaf);border-color:var(--leaf)}
.vt li.late::before{background:var(--bad);border-color:var(--bad)}
.vt li.soon::before{border-color:var(--gold)}
.vt b{display:block;font-size:14px}
.vt span{font-size:12.5px;color:var(--muted)}
.tl{list-style:none;margin:0;padding:0}
.tl li+li{border-top:1px solid var(--line)}
.tl button{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;padding:9px 0;text-align:left;color:inherit;min-height:52px}
.tl .when{width:48px;flex:none;text-align:center;background:var(--surface2);border-radius:10px;padding:4px 0;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.tl .when b{display:block;font-family:var(--f-display);font-size:18px;line-height:1.1;letter-spacing:0}
.tl li.late .when{background:var(--bad-bg);color:var(--bad)}
.tl li.soon .when{background:var(--warn-bg);color:var(--warn)}
.tl .what{min-width:0;flex:1}.tl .what b{display:block;font-size:14px}
.inp svg{color:var(--muted)}
@media (max-width:370px){.dtop{flex-direction:column;align-items:flex-start}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v3 : photos ajustées au cadre, accueil/stock, boutique marron ===== */
:root{--amberc:#C47F35}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--amberc:#E0A056}}
:root[data-theme="dark"]{--amberc:#E0A056}
.thumb img{padding:3px}
.hero img{padding:4px}
.lead{color:var(--muted);font-size:17px;line-height:1.35;margin:0 2px 12px}
.btn.amber{background:var(--amberc);border-color:var(--amberc);color:#2A1608}
.btn.soft{background:var(--surface2);border-color:transparent;color:var(--ink)}
.pill.amber{background:var(--warn-bg);color:var(--warn)}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column;gap:2px;min-height:132px}
.kpi small{color:var(--muted);font-size:13.5px}
.kpi b{font-family:var(--f-display);font-size:clamp(24px,7.4vw,32px);line-height:1.05;font-weight:800;overflow-wrap:anywhere;margin-top:6px}
.kpi b.bad{color:var(--bad)}
.kpi span{font-size:13px;color:var(--leaf);margin-top:auto;padding-top:6px}
.kpi span.warn{color:var(--warn)}.kpi span.bad{color:var(--bad)}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sech h2{font-family:'Fraunces',Georgia,serif;font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.lnk{background:none;border:0;color:var(--amberc);font-weight:700;font-size:15px;min-height:40px;padding:0 4px;white-space:nowrap}
.datechip{display:inline-flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:8px 16px;margin-bottom:6px}
.datechip small{color:var(--muted);font-size:13.5px}
.datechip b{font-family:var(--f-display);font-size:20px}
.flist{margin-top:8px}
.frow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:inherit;text-align:left;padding:12px 0;border-top:1px solid var(--line);min-height:76px}
.frow:first-child{border-top:0}
.frow .thumb{width:58px;height:58px;border-radius:14px}
.frow .fm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.frow .fm>b{font-family:var(--f-display);font-size:16px;line-height:1.15;overflow-wrap:anywhere}
.frow .prog{display:block;margin-top:6px;height:7px}
.rtiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.rtile{background:color-mix(in srgb,var(--amberc) 14%,var(--surface));border-radius:18px;padding:12px 16px;min-width:92px;display:flex;flex-direction:column;gap:1px}
.rtile b{font-family:var(--f-display);font-size:24px;line-height:1.1}
.rtile span{color:var(--muted);font-size:14px}
.rtile em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:2px}
.rtile.z{opacity:.55}
.acttbl td,.acttbl th{text-align:left;vertical-align:middle}
.acttbl td{font-family:var(--f-body);padding:12px 6px}
.acttbl td small{display:block;color:var(--muted);font-size:12px}
.acttbl td:nth-child(3){font-family:var(--f-mono)}
.inv{font-size:14px}
.inv th{text-align:right;line-height:1.15}
.inv th:first-child,.inv th:nth-child(2),.inv td:nth-child(2){text-align:left}
.inv td{padding:12px 4px}
.inv td:nth-child(2){font-family:var(--f-body);font-size:13.5px}
.inv tfoot td{border-top:2px solid var(--line);font-weight:700;color:var(--ink)}
.inv tfoot td:first-child{font-family:var(--f-body)}
.tn.skip i{border-style:dashed;opacity:.45}
.tn.skip{opacity:.7}
.cline{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px}
.cline .thumb{width:64px;height:64px;flex:none}

<script>
/* ============ outils ============ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:1});
const ar=n=>nf.format(Math.round(n||0))+' Ar';
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.').replace(/\s/g,''));return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(n,from)=>{const d=from?new Date(from+'T00:00:00'):new Date();d.setDate(d.getDate()+n);return ymd(d)};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5);
const fdate=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}):'—';
const fshort=d=>d?new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'}):'—';
const clone=o=>JSON.parse(JSON.stringify(o));
const pl=(n,s,p)=>nf1.format(n)+' '+(n>1?(p||s+'s'):s);
const clamp=(x,a,b)=>Math.min(b,Math.max(a,x));

const IC={
 jar:'<path d="M8 3h8M7 6h10M6.500 6C5.500 7.200 5 8.600 5 10.200V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8.800c0-1.600-.5-3-1.500-4.200"/><path d="M5 13h14"/>',
 bottle:'<path d="M10 2h4v4.500c0 1 .8 1.800 1.800 3 .8 1 1.200 2 1.200 3.500V20a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-7c0-1.500.4-2.500 1.200-3.500C9.200 8.300 10 7.500 10 6.500z"/><path d="M7 14h10"/>',
 box:'<path d="M3 7.500 12 3l9 4.500v9L12 21l-9-4.500z"/><path d="M3 7.500l9 4.500 9-4.500M12 12v9"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 check:'<path d="M5 12.500l4.500 4.500L19 7.500"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 minus:'<path d="M5 12h14"/>',
 camera:'<path d="M4 8h3l1.500-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.500"/>',
 home:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',
 shop:'<path d="M4 9l1.500-5h13L20 9v11H4z"/><path d="M9 20v-6h6v6M4 9h16"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
 arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 search:'<circle cx="11" cy="11" r="6.500"/><path d="M16 16l4.500 4.500"/>',
 cart:'<path d="M3 4h2.500l2.200 11h10.500l2-8H6.500"/><circle cx="9.500" cy="19.500" r="1.500"/><circle cx="17" cy="19.500" r="1.500"/>',
 trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/>'
};
const ic=(n,s)=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"${s?` style="width:${s}px;height:${s}px"`:''}>${IC[n]}</svg>`;

/* ============ calculs (testés) ============ */
//#calc-start
const DEF={
  prix:{alcool:12000,sucre:4500,miel:15000},
  fmt:{'35':{label:'35 cl',nom:'35 cl plastique',cl:35,bouteille:600,bouchon:false},
       '70':{label:'70 cl',nom:'70 cl verre',cl:70,bouteille:2500,bouchon:true},
       '75':{label:'75 cl',nom:'75 cl verre',cl:75,bouteille:2800,bouchon:true}},
  bouchon:400,surbouchon:300,etiquette:150,carton:3000,parCarton:6,
  autres:{electricite:60,eau:40,transport:100},
  rend:{'4':{'35':11,'70':5,'75':5},'8':{'35':22,'70':11,'75':10},'10':{'35':28,'70':14,'75':13}},
  alerteJours:7,objectifMarge:35,stockBas:3,priced:false,
  commercial:{nom:'',signature:'',pin:''}
};
function mergeCfg(d,s){
  if(Array.isArray(d)||typeof d!=='object'||d===null)return s===undefined?d:s;
  const o={};for(const k in d){o[k]=(s&&s[k]!==undefined)?mergeCfg(d[k],s[k]):clone(d[k])}
  if(s)for(const k in s)if(!(k in o))o[k]=s[k];
  return o;
}
function jarCost(j,cfg){
  const alcool=num(j.alcool)*num(cfg.prix.alcool),sucre=num(j.sucre)/1000*num(cfg.prix.sucre),
        miel=num(j.miel)/1000*num(cfg.prix.miel),parfum=num(j.parfumMontant);
  return {alcool,sucre,miel,parfum,total:alcool+sucre+miel+parfum};
}
function yieldFor(cap,cfg){
  const r=cfg.rend[String(cap)],out={};
  for(const f in cfg.fmt)out[f]=(r&&r[f]!=null&&r[f]!=='')?num(r[f]):Math.floor((num(cap)+1e-9)/(cfg.fmt[f].cl/100));
  return out;
}
function packPerBottle(f,cfg){
  const F=cfg.fmt[f];
  let c=num(F.bouteille)+num(cfg.etiquette)+num(cfg.carton)/Math.max(1,num(cfg.parCarton));
  if(F.bouchon)c+=num(cfg.bouchon)+num(cfg.surbouchon);
  return c;
}
function otherPerBottle(cfg){return Object.values(cfg.autres).reduce((a,b)=>a+num(b),0)}
function bottlingCalc(jarTotal,q,cfg,autresTotal){
  let litres=0,count=0;
  for(const f in cfg.fmt){const n=num(q[f]);litres+=n*cfg.fmt[f].cl/100;count+=n}
  const perL=litres>0?jarTotal/litres:0,per={};
  let emb=0;
  for(const f in cfg.fmt){
    const n=num(q[f]);if(n<=0)continue;
    const liquide=perL*cfg.fmt[f].cl/100,pack=packPerBottle(f,cfg),autres=count>0?autresTotal/count:0;
    per[f]={n,liquide,emb:pack,autres,total:liquide+pack+autres};
    emb+=pack*n;
  }
  return {litres,count,perL,per,total:jarTotal+emb+(count>0?autresTotal:0)};
}
const roundUp=(x,s)=>Math.ceil(x/s-1e-9)*s;
const suggestDetail=c=>roundUp(c*2,500);
const suggestGros=c=>roundUp(c*1.6,500);
function jarAlerts(j,cfg,t){
  if(j.status==='embouteille')return [];
  const lim=j.alerte!=null&&j.alerte!==''?num(j.alerte):num(cfg.alerteJours),out=[];
  const chk=(date,label,doneWord)=>{
    if(!date)return;const d=dayDiff(t,date);
    if(d<0)out.push({sev:'bad',d,text:`${label} dépassée de ${pl(-d,'jour')}`});
    else if(d===0)out.push({sev:'warn',d,text:`${label} : aujourd'hui`});
    else if(d<=lim)out.push({sev:'warn',d,text:`${label} dans ${pl(d,'jour')}`});
  };
  chk(j.dateFin,'Fin de fermentation');
  chk(j.dateMise,'Mise en bouteille prévue');
  return out.sort((a,b)=>a.d-b.d);
}
function periodSales(sales,p,t){
  const arr=Object.values(sales);
  if(p==='all')return arr;
  const n=p==='today'?0:parseInt(p,10)-1,from=addDays(-n,t);
  return arr.filter(s=>s.date>=from&&s.date<=t);
}
function sumSales(arr){
  const ca=arr.reduce((a,s)=>a+s.total,0),cout=arr.reduce((a,s)=>a+s.cout,0);
  return {ca,cout,ben:ca-cout,marge:ca>0?(ca-cout)/ca*100:0,n:arr.length};
}
//#calc-end

/* ============ état & stockage ============ */
const LS_KEY='nyakama.v1';
const S={cfg:clone(DEF),jars:{},bottlings:{},lots:{},sales:{},products:{}};
const UI={tab:'home',seg:'parcours',mode:'detail',cart:{},period:'30',ready:false,filter:'all',focus:null,jseg:'ferm',jparf:'all',sparf:'all',role:(()=>{try{return localStorage.getItem('nyakama.role')==='commercial'?'commercial':'admin'}catch(e){return 'admin'}})()};
let DBH=null;const wq={};

function enqueue(key,fn){
  wq[key]=(wq[key]||Promise.resolve()).then(fn).catch(e=>toast('Enregistrement impossible : '+((e&&(e.message||e.code))||'erreur')));
}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){toast('Mémoire du téléphone pleine : retirez des photos.')}}
function loadLocal(){
  try{const r=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(r){for(const k of['jars','bottlings','lots','sales','products'])S[k]=r[k]||{};S.cfg=mergeCfg(DEF,r.cfg)}}catch(e){}
  UI.ready=true;render();
}
let NY_AUTH=null, NY_UID=null, NY_PROFILE=null, NY_READY=false, NY_UNSUB=[];
function put(col,id,obj){
  obj=clone(obj);
  if(col==='sales' && NY_UID){obj.uid=NY_UID;obj.vendeur=(NY_PROFILE&&NY_PROFILE.name)||obj.vendeur||'';obj.createdAt=Date.now();}
  S[col][id]=obj;
  if(DBH && NY_UID) enqueue(col+'/'+id,()=>DBH.collection(col).doc(id).set(obj));
  else saveLocal();
}
function del(col,id){
  delete S[col][id];
  if(DBH && NY_UID) enqueue(col+'/'+id,()=>DBH.collection(col).doc(id).delete());
  else saveLocal();
}
function putCfg(cfg){
  S.cfg=clone(cfg);
  if(DBH && NY_UID && NY_PROFILE && NY_PROFILE.role==='admin') enqueue('config/main',()=>DBH.doc('config/main').set(clone(cfg)));
  else if(!DBH) saveLocal();
}
function nyShowLogin(msg=''){
  const el=document.getElementById('ny-auth'); if(el)el.hidden=false;
  const err=document.getElementById('ny-auth-error');if(err)err.textContent=msg;
  const ac=document.getElementById('ny-account');if(ac)ac.hidden=true;
}
function nyHideLogin(){const el=document.getElementById('ny-auth');if(el)el.hidden=true;}
function nyStopListeners(){NY_UNSUB.forEach(fn=>{try{fn()}catch(e){}});NY_UNSUB=[];}
function nyFailClosed(msg){NY_READY=false;UI.ready=false;nyShowLogin(msg);render();}
async function nyLoadAccount(user){
  nyStopListeners(); NY_UID=user.uid;
  DBH=firebase.firestore();
  try{

    NY_UNSUB.push(DBH.doc('config/main').onSnapshot(snap=>{if(snap.exists){S.cfg=mergeCfg(DEF,snap.data());render();}},err=>toast('Configuration inaccessible : '+(err.code||'erreur'))));
  }catch(e){console.error(e);nyFailClosed('Connexion impossible. Vérifiez le profil utilisateur et les règles Firestore.');}

function openSheet(title,body,footer,mount,cls){
  closeSheet(true);

  w.innerHTML=`<div class="scrim" data-act="close"></div><section class="sheet ${cls||''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="iconbtn" data-act="close" aria-label="Fermer">${ic('x')}</button></header><div class="body">${body}</div>${footer?`<footer>${footer}</footer>`:''}</section>`;
  $('#layer').appendChild(w);

  const hd=$('header',w),sh=$('.sheet',w);let y0=null,dy=0;
  hd.addEventListener('touchstart',e=>{y0=e.touches[0].clientY;dy=0;sh.style.animation='none'},{passive:true});

function readPhoto(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();
      im.onload=()=>{const m=480,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};
      im.onerror=rej;im.src=fr.result};
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}

function stockByParfum(){
  const m={};
  Object.values(S.lots).forEach(l=>{
    const k=pkey(l),q=num(l.qty);
    const o=m[k]=m[k]||{k,nom:pname(l),q:{},tot:0,cap:0,det:0,n:{ferm:0,direct:0},photo:''};
    o.q[l.f]=(o.q[l.f]||0)+q;o.tot+=q;o.cap+=q*num(l.cout);o.det+=q*num(l.prixDetail);
    if(l.direct)o.n.direct++;else o.n.ferm++;
    if(!o.photo&&l.photo)o.photo=l.photo;
  });
  return Object.values(m).sort((a,b)=>b.tot-a.tot||a.nom.localeCompare(b.nom,'fr'));
}
const origLabel=o=>o.n.direct&&o.n.ferm?'Mixte':o.n.direct?'Ajout direct':'Fermentation';
function salesByParfum(arr){
  const m={};
  arr.forEach(s=>s.lines.forEach(l=>{
    const nom=String(l.parfum||l.nom||'').trim(),k=nom.toLowerCase();
    const o=m[k]=m[k]||{nom,q:{},tot:0,ca:0,ben:0};

function stockText(){
  const P=stockByParfum().filter(p=>p.tot>0),fm=fmtKeys(),cfg=S.cfg,W=34,line='-'.repeat(W);
  const q=P.reduce((a,p)=>a+p.tot,0),vc=P.reduce((a,p)=>a+p.cap,0),vr=P.reduce((a,p)=>a+p.det,0);
  const L=['NY AKAMA - STOCK FINI',new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}),line,`TOTAL : ${q} bouteille${q>1?'s':''}`];
  P.forEach(p=>{
    const det=fm.filter(f=>(p.q[f]||0)>0).map(f=>`${nf1.format(cfg.fmt[f].cl)}cl:${p.q[f]}`).join(' ');
    L.push(`${String(p.tot).padStart(4)}  ${p.nom}`+(det?`  (${det})`:''));
  });
  L.push(line,'PAR FORMAT');
  fm.forEach(f=>L.push(`${cfg.fmt[f].label.padEnd(8)} ${P.reduce((a,p)=>a+(p.q[f]||0),0)}`));
  L.push(line,`Capital au cout : ${nf.format(Math.round(vc))} Ar`,`Valeur en detail : ${nf.format(Math.round(vr))} Ar`);
  const sp=salesByParfum(Object.values(S.sales));
  if(sp.length){
    L.push(line,`VENTES TOTALES : ${sp.reduce((a,p)=>a+p.tot,0)} bouteilles`);
    sp.forEach(p=>L.push(`${String(p.tot).padStart(4)}  ${p.nom}  ${nf.format(Math.round(p.ca))} Ar`));
  }
  return L.join('\n');
}

function commitDirect(o){
  const f=o.f,qty=Math.max(0,Math.floor(num(o.qty))),name=String(o.parfum||'').trim();
  if(!name||qty<=0||!S.cfg.fmt[f])return null;
  const bid=uid(),lid=uid(),cout=num(o.cout),date=o.date||today();
  const slug=name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'x';
  put('bottlings',bid,{id:bid,type:'direct',jarId:'',jarName:'Ajout direct',parfum:name,f,date,ts:Date.now(),q:{[f]:qty},unit:{[f]:cout},lotId:lid,litres:0,total:qty*cout,autres:0,ex:!!o.ex});
  put('lots',lid,{id:lid,bid,jarId:'direct-'+slug,jarName:'Ajout direct',parfum:name,f,qty0:qty,qty,cout,prixDetail:num(o.pd),prixGros:num(o.pg),photo:o.photo||'',date,direct:true,ex:!!o.ex});
  return lid;
}

function saveDirect(){
  const w=$('#sheet');if(!w||!w._f)return;

     ${rows.length?`<h2 class="sec">Marge par produit</h2><div class="card stack" style="gap:12px">${rows.map(([k,v])=>{const mg=v.ca>0?(v.ca-v.co)/v.ca*100:0;return `<div><div class="row-h small"><span>${esc(k)}</span><b class="num">${nf1.format(mg)} %</b></div><div class="prog" style="margin-top:5px"><i style="width:${clamp(mg,0,100)}%"></i></div></div>`}).join('')}</div>`:''}${parfumSalesTable(arr)}<h2 class="sec">Détail et gros</h2><div class="stats" style="grid-template-columns:1fr 1fr"><div class="stat"><small>Détail</small><b>${ar(mode.detail.ca)}</b><span>${pl(mode.detail.n,'bouteille')}</span></div><div class="stat"><small>Gros</small><b>${ar(mode.gros.ca)}</b><span>${pl(mode.gros.n,'bouteille')}</span></div></div><button class="btn ghost block" style="margin-top:16px" data-act="csv">Exporter les ventes (CSV)</button>`;
    return h;
  }
  const sales=Object.values(S.sales).sort((a,b)=>b.ts-a.ts);
  if(!sales.length)return h+`<div class="card empty"><h3>Aucune vente</h3><p class="muted">Chaque vente validée garde son reçu ici.</p></div>`;
  return h+`<div class="stack">${sales.map(s=>`<button class="sale" data-act="sale-view" data-id="${s.id}"><span class="m"><b>Reçu n° ${String(s.no).padStart(4,'0')}${s.client?' · '+esc(s.client):''}</b><span class="small muted">${new Date(s.ts).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})} · ${s.mode==='gros'?'gros':'détail'} · ${esc(s.pay||'')}</span></span><span class="num"><b>${ar(s.total)}</b>${isCom()?'':`<span class="small muted">+${nf.format(s.ben)}</span>`}</span></button>`).join('')}</div>`;
}

/* ============ fiche détaillée d'un bocal ============ */
function relDay(d){if(!d)return '—';const n=dayDiff(today(),d);return n===0?"aujourd'hui":n>0?'dans '+pl(n,'jour'):'il y a '+pl(-n,'jour')}
function ring(pct,big,sub,col){
  const R=44,C=2*Math.PI*R;
  return `<svg class="ringsvg" viewBox="0 0 100 100" role="img" aria-label="${esc(big+' '+sub)}"><circle class="rb" cx="50" cy="50" r="${R}"/><circle class="rg" cx="50" cy="50" r="${R}" transform="rotate(-90 50 50)" style="stroke:${col};--c:${C.toFixed(1)};stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${(C*(1-clamp(pct,0,100)/100)).toFixed(1)}"/><text class="rt" x="50" y="52">${esc(big)}</text><text class="rs" x="50" y="65">${esc(sub)}</text></svg>`;
}
function compBar(parts){
  const ps=parts.filter(p=>p.v>0),tot=ps.reduce((a,p)=>a+p.v,0)||1;
  return `<div class="comp" role="img" aria-label="${esc(ps.map(p=>p.l+' '+Math.round(p.v/tot*100)+' %').join(', '))}">${ps.map(p=>`<i style="flex:${p.v};background:var(${p.c})"></i>`).join('')}</div><div class="legend">${ps.map(p=>`<span><i style="background:var(${p.c})"></i>${esc(p.l)} <b class="num">${nf1.format(p.v/tot*100)} %</b></span>`).join('')}</div>`;
}
function lotDetail(l){
  const d=l.det;if(!d)return '';
  const sold=Object.values(S.sales).reduce((a,s)=>a+s.lines.filter(x=>x.lotId===l.id).reduce((y,x)=>y+x.qty,0),0);
  return `<details class="bk"><summary>Coût de revient détaillé</summary>${compBar([{l:'Liquide',v:d.liquide,c:'--c1'},{l:'Emballage',v:d.emb,c:'--c5'},{l:'Autres',v:d.autres,c:'--c6'}])}<div class="lines" style="margin-top:8px"><div><span>Liquide</span><span class="num">${ar(d.liquide)}</span></div><div><span>Emballage</span><span class="num">${ar(d.emb)}</span></div><div><span>Autres dépenses</span><span class="num">${ar(d.autres)}</span></div><div class="tot"><span>Coût de revient</span><span class="num">${ar(l.cout)}</span></div><div><span>Mises en stock</span><span class="num">${nf.format(num(l.qty0))}</span></div><div><span>Vendues</span><span class="num">${nf.format(sold)}</span></div></div></details>`;
}
function extendJar(id){
  const j=S.jars[id];if(!j)return;
  put('jars',id,{...j,dateFin:j.dateFin?addDays(7,j.dateFin):j.dateFin,dateMise:j.dateMise?addDays(7,j.dateMise):j.dateMise});
  render();openJarDetail(id);toast('Fermentation prolongée de 7 jours');
}
function openJarDetail(id){

  const tot=(j.dateDebut&&j.dateFin)?Math.max(1,dayDiff(j.dateDebut,j.dateFin)):0,el=j.dateDebut?dayDiff(j.dateDebut,t):0;

  const pct=done?100:(tot?clamp(el/tot*100,0,100):0);
  const rg=done?ring(100,'Fini','embouteillé',col):late?ring(100,'+'+(-left)+' j','de retard',col):ring(pct,'J'+Math.max(0,el),tot?'sur '+tot+' jours':'en cours',col);

  const ing=[['Alcool',nf1.format(lit)+' L × '+ar(cfg.prix.alcool)+' / L',cost.alcool,'--c1'],['Sucre',nf.format(num(j.sucre))+' g × '+ar(cfg.prix.sucre)+' / kg',cost.sucre,'--c2'],['Miel',nf.format(num(j.miel))+' g × '+ar(cfg.prix.miel)+' / kg',cost.miel,'--c3'],['Parfum'+(j.parfumNom?' · '+j.parfumNom:''),'montant direct',cost.parfum,'--c4']];
  const fb=fm.filter(f=>num(yl[f])>0).map(f=>{
    const n=num(yl[f]),b=bottlingCalc(cost.total,{[f]:n},cfg,otherPerBottle(cfg)*n),p=b.per[f],pd=suggestDetail(p.total),mg=pd>0?(pd-p.total)/pd*100:0;
    return `<div class="fmtrow"><div class="row-h"><h4>${n} × ${esc(cfg.fmt[f].nom)}</h4><span class="num"><b>${ar(p.total)}</b> <span class="small muted">/ btl</span></span></div>${compBar([{l:'Liquide',v:p.liquide,c:'--c1'},{l:'Emballage',v:p.emb,c:'--c5'},{l:'Autres',v:p.autres,c:'--c6'}])}<p class="small muted">Prix détail conseillé <b class="num">${ar(pd)}</b> · marge ${nf1.format(mg)} % · bénéfice ${ar((pd-p.total)*n)} si tout est vendu</p></div>`}).join('');
  let actual='';
  if(done&&bot){
    actual=`<h3 class="dsec">Mise en bouteille réelle · ${fdate(j.dateMise)}</h3><div class="stack" style="gap:8px">${lots.map(l=>{
      const sold=sl.filter(x=>x.l.lotId===l.id).reduce((a,x)=>a+x.l.qty,0);
      return `<div class="fmtrow"><div class="row-h"><h4>${esc(cfg.fmt[l.f].nom)}</h4><span class="num">${ar(l.cout)} <span class="small muted">/ btl</span></span></div><div class="kv" style="margin:0"><div><small>Produites</small><b>${nf.format(num(l.qty0))}</b></div><div><small>En stock</small><b>${nf.format(num(l.qty))}</b></div><div><small>Vendues</small><b>${nf.format(sold)}</b></div></div></div>`}).join('')}</div>
      <div class="recap"><div class="r"><span>Coût total (bocal + emballages + autres)</span><b>${ar(bot.total)}</b></div><div class="r"><span>Bouteilles vendues</span><b>${nf.format(vend)}</b></div><div class="r"><span>Chiffre d'affaires (avant remise)</span><b>${ar(ca)}</b></div><div class="r"><span>Bénéfice réalisé</span><b>${ar(ca-cv)}</b></div><div class="r"><span>Marge brute</span><b>${nf1.format(ca>0?(ca-cv)/ca*100:0)} %</b></div></div>`;
  }
  const ev=[];
  if(j.dateDebut)ev.push({d:j.dateDebut,t:'Début de fermentation',k:'done'});
  if(j.dateFin)ev.push({d:j.dateFin,t:'Fin de fermentation',k:done||j.dateFin<=t?(done||j.dateFin===t?'done':'late'):(dayDiff(t,j.dateFin)<=num(j.alerte===''||j.alerte==null?cfg.alerteJours:j.alerte)?'soon':'')});
  if(j.dateMise)ev.push({d:j.dateMise,t:done?'Mise en bouteille':'Mise en bouteille prévue',k:done?'done':(j.dateMise<t?'late':(dayDiff(t,j.dateMise)<=num(j.alerte===''||j.alerte==null?cfg.alerteJours:j.alerte)?'soon':''))});
  sl.slice(0,6).forEach(x=>ev.push({d:x.s.date,t:'Vente · '+x.l.qty+' × '+x.l.nom,k:'done'}));
  ev.sort((a,b)=>a.d.localeCompare(b.d));
  const body=`<div class="hero">${j.photo?`<img src="${j.photo}" alt="Photo du bocal ${esc(j.nom)}">`:ic('jar',48)}</div>
    <div class="dtop">${rg}<div><h3>${esc(j.nom)}</h3><p class="small muted" style="margin:2px 0 8px">${esc(j.parfumNom||'Sans parfum')} · ${nf1.format(num(j.cap))} L</p><span class="pill ${st.cls}">${st.icon?ic(st.icon):''}${esc(st.txt)}</span></div></div>
    <h3 class="dsec">Coût du bocal · ${ar(cost.total)}</h3>
    <div class="card" style="box-shadow:none">${compBar(ing.map(r=>({l:r[0].split(' · ')[0],v:r[2],c:r[3]})))}<div style="margin-top:8px">${ing.map(r=>`<div class="ing"><i style="background:var(${r[3]})"></i><div class="n">${esc(r[0])}<small>${esc(r[1])}</small></div><span class="num">${ar(r[2])}</span></div>`).join('')}</div>
      <div class="lines" style="margin-top:6px"><div class="tot"><span>Total du bocal</span><span class="num">${ar(cost.total)}</span></div><div><span>Par litre d'alcool</span><span class="num">${lit>0?ar(cost.total/lit):'—'}</span></div><div><span>Sucre par litre</span><span class="num">${lit>0?nf.format(num(j.sucre)/lit)+' g':'—'}</span></div><div><span>Miel par litre</span><span class="num">${lit>0?nf.format(num(j.miel)/lit)+' g':'—'}</span></div></div></div>
    <h3 class="dsec">${done?'Rendement prévu':'Rendement et coût par bouteille'}</h3>
    <div class="stack" style="gap:8px">${fb||'<p class="muted small">Aucun rendement renseigné.</p>'}</div>
    ${actual}
    <h3 class="dsec">Calendrier</h3>
    <ul class="vt">${ev.map(e=>`<li class="${e.k}"><b>${esc(e.t)}</b><span>${fdate(e.d)} · ${relDay(e.d)}</span></li>`).join('')}</ul>`;
  const foot=done?`<div class="btns"><button class="btn" data-act="tab" data-t="stock">Voir le stock</button><button class="btn ghost" data-act="jar-edit" data-id="${id}">Modifier</button></div>`
    :`<div class="btns"><button class="btn" data-act="jar-bottle" data-id="${id}">${ic('bottle',18)} Mettre en bouteille</button><button class="btn ghost" data-act="jar-extend" data-id="${id}">+ 7 jours</button><button class="btn ghost" data-act="jar-edit" data-id="${id}">Modifier</button></div>`;
  openSheet(j.nom,body,foot,null,'tall');
}

/* ============ bocal : formulaire ============ */
function openJarForm(id,refill){
  const ex=id&&S.jars[id];
  const j=ex?clone(ex):{nom:'Bocal '+(Object.keys(S.jars).length+1),cap:8,alcool:'',sucre:'',miel:'',parfumNom:'',parfumMontant:'',dateDebut:today(),dateFin:addDays(30),dateMise:addDays(31),alerte:'',status:'ferment',photo:''};
  if(refill&&ex){const dur=(ex.dateDebut&&ex.dateFin)?Math.max(1,dayDiff(ex.dateDebut,ex.dateFin)):30;j.dateDebut=today();j.dateFin=addDays(dur);j.dateMise=addDays(dur+1);j.status='ferment'}
  let photo=j.photo||'',cap=num(j.cap)||8,dirtyR=!!(ex&&j.rend);

    ${photoBlock(photo)}
    <div class="field"><span>Capacité du bocal</span><div class="chips" id="capchips">${[4,8,10].map(c=>`<button type="button" class="chip" data-cap="${c}" aria-pressed="${cap===c}">${c} L</button>`).join('')}<button type="button" class="chip" data-cap="x" aria-pressed="${![4,8,10].includes(cap)}">Autre</button></div>
      <span class="inp" id="capother" ${[4,8,10].includes(cap)?'hidden':''}><input name="capx" inputmode="decimal" value="${esc([4,8,10].includes(cap)?'':cap)}" aria-label="Capacité en litres" autocomplete="off"><em>L</em></span></div>
    <h3 style="font-size:16px">Recette</h3>
    <div class="grid2">${fld('Alcool','alcool',j.alcool,{suf:'litres'})}${fld('Sucre','sucre',j.sucre,{suf:'g'})}</div>
    <div class="grid2">${fld('Miel','miel',j.miel,{suf:'g'})}${fld('Parfum (montant)','pm',j.parfumMontant,{suf:'Ar'})}</div>
    ${fld('Nom du parfum','pn',j.parfumNom,{mode:'text',ph:'ex. Vanille bourbon'})}

    <div class="grid2">${fld('Début de fermentation','d1',j.dateDebut,{type:'date'})}${fld('Fin de fermentation','d2',j.dateFin,{type:'date'})}</div>
    <div class="grid2">${fld('Mise en bouteille prévue','d3',j.dateMise,{type:'date'})}${fld('Alerte avant (jours)','al',j.alerte,{suf:'jours',ph:String(S.cfg.alerteJours),mode:'numeric'})}</div>

    <p class="small muted" style="margin-top:-8px">Nombre de bouteilles attendues. Modifiable.</p>
    <div class="grid3">${fmts.map(f=>fld(S.cfg.fmt[f].label,'r'+f,rend[f],{mode:'numeric'})).join('')}</div>
    <div class="recap" id="recap" aria-live="polite"></div>`;
  const foot=`<div class="btns"><button class="btn" data-act="jar-save">${refill?'Remplir à nouveau':'Enregistrer'}</button>${ex&&!refill?`<button class="btn danger" data-act="jar-del" data-armed="0">Supprimer</button>`:''}</div>`;
  const w=openSheet(refill?'Remplir à nouveau':ex?'Modifier le bocal':'Nouveau bocal',body,foot,w=>{
    wirePhoto(w,()=>photo,d=>{photo=d});
    const recalc=()=>{
      const jj=readJar(w);const cost=jarCost(jj,S.cfg);
      const rd={};fmts.forEach(f=>rd[f]=num(val(w,'r'+f)));
      let r=`<div class="h">Coût du bocal</div>
       <div class="r"><span>Alcool</span><b>${ar(cost.alcool)}</b></div><div class="r"><span>Sucre</span><b>${ar(cost.sucre)}</b></div>

       <div class="r" style="border-top:1px dashed var(--line);padding-top:6px"><span><b style="font-family:var(--f-body)">Total</b></span><b>${ar(cost.total)}</b></div>
       <div class="r"><span>Par litre d'alcool</span><b>${num(jj.alcool)>0?ar(cost.total/num(jj.alcool)):'—'}</b></div>
       <div class="h">Si tout le bocal passe en…</div>`;
      fmts.forEach(f=>{const n=rd[f];
        if(n>0){const b=bottlingCalc(cost.total,{[f]:n},S.cfg,otherPerBottle(S.cfg)*n);r+=`<div class="r"><span>${n} × ${S.cfg.fmt[f].label}</span><b>${ar(b.per[f].total)} / bouteille</b></div>`}

      $('#capother',w).hidden=v!=='x';

      recalc();
    }));
    w.querySelector('[name="capx"]').addEventListener('input',e=>{cap=num(e.target.value);if(!dirtyR){const y=yieldFor(cap,S.cfg);fmts.forEach(f=>{w.querySelector('[name="r'+f+'"]').value=y[f]})}recalc()});
    fmts.forEach(f=>w.querySelector('[name="r'+f+'"]').addEventListener('input',()=>{dirtyR=true}));
    w.addEventListener('input',recalc);recalc();
    w._get=()=>{const jj=readJar(w);jj.cap=cap;jj.photo=photo;return jj};
    w._ex=ex;w._refill=!!refill;
  });
}
function readJar(w){
  const fmts=Object.keys(S.cfg.fmt),rend={};fmts.forEach(f=>rend[f]=num(val(w,'r'+f)));
  return {nom:val(w,'nom').trim(),alcool:num(val(w,'alcool')),sucre:num(val(w,'sucre')),miel:num(val(w,'miel')),
    parfumNom:val(w,'pn').trim(),parfumMontant:num(val(w,'pm')),dateDebut:val(w,'d1'),dateFin:val(w,'d2'),dateMise:val(w,'d3'),
    alerte:val(w,'al')===''?'':num(val(w,'al')),rend};
}
function saveJar(){
  const w=$('#sheet');if(!w||!w._get)return;
  const d=w._get(),ex=w._ex;
  if(!d.nom){toast('Donnez un nom au bocal.');return}
  if(!(d.cap>0)){toast('Indiquez la capacité du bocal.');return}
  if(d.dateDebut&&d.dateFin&&d.dateFin<d.dateDebut){toast('La fin de fermentation est avant le début.');return}
  const base=ex?clone(ex):{id:uid(),status:'ferment'};
  const j={...base,...d};if(w._refill){j.status='ferment';j.bottlingId='';j.cycles=num(base.cycles)+1}j.cout=jarCost(j,S.cfg);
  const rf=w._refill;put('jars',j.id,j);closeSheet();toast(rf?'Bocal rempli à nouveau':ex?'Bocal modifié':'Bocal ajouté');UI.tab='jars';if(rf)UI.jseg='ferm';render();
}
function deleteJar(btn){
  const w=$('#sheet');if(!w||!w._ex)return;
  if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='Confirmer la suppression';return}
  const id=w._ex.id;
  Object.values(S.lots).filter(l=>l.jarId===id).forEach(l=>del('lots',l.id));
  Object.values(S.bottlings).filter(b=>b.jarId===id).forEach(b=>del('bottlings',b.id));
  del('jars',id);closeSheet();toast('Bocal supprimé');render();
}

/* ============ mise en bouteille ============ */

}
function openBottling(id){

    ${fmts.map(f=>`<div class="fmtrow" data-f="${f}"><div class="row-h"><h4>${cfg.fmt[f].nom}</h4><span class="small muted">${cfg.fmt[f].bouchon?'avec bouchon':'sans bouchon'}</span></div>
      <div class="grid3" style="grid-template-columns:1fr 1fr 1fr">${fld('Bouteilles','q'+f,start[f],{mode:'numeric'})}${fld('Prix détail','pd'+f,'',{suf:'Ar'})}${fld('Prix gros','pg'+f,'',{suf:'Ar'})}</div>

          tot+=pd*q[f];ben+=(pd-p.total)*q[f];
        }else $('#u'+f,w).textContent='';
      });
      const over=b.litres>num(j.cap)+1e-6;
      $('#brecap',w).innerHTML=`<div class="r"><span>Bouteilles produites</span><b>${nf.format(count)}</b></div><div class="r"><span>Litres embouteillés</span><b>${nf1.format(b.litres)} L</b></div>
        <div class="r"><span>Coût total (bocal + emballages + autres)</span><b>${ar(b.total)}</b></div><div class="r"><span>Coût par litre fini</span><b>${b.litres>0?ar(b.perL):'—'}</b></div>
        <div class="r"><span>Bénéfice attendu (tout vendu en détail)</span><b>${ar(ben)}</b></div>${over?`<div class="r" style="color:var(--bad)"><span>Attention : plus de litres que la capacité du bocal (${nf1.format(num(j.cap))} L)</span></div>`:''}`;
      w._calc={q,b};
    };
    $$('[data-fill]',w).forEach(bn=>bn.addEventListener('click',()=>{
      const f0=bn.dataset.fill;fmts.forEach(f=>{w.querySelector('[name="q'+f+'"]').value=f===f0?num(yl[f]):0});
      $$('[data-fill]',w).forEach(x=>x.setAttribute('aria-pressed',String(x===bn)));
      fmts.forEach(f=>{dirty['pd'+f]=false;dirty['pg'+f]=false});calc();
    }));
    w.addEventListener('input',e=>{const n=e.target.name;if(n in dirty)dirty[n]=true;if(/^q/.test(n)){fmts.forEach(f=>{dirty['pd'+f]=false;dirty['pg'+f]=false})}calc()});
    calc();
  });
}

function receiptText(s){
  const W=32,ctr=t=>' '.repeat(Math.max(0,Math.floor((W-t.length)/2)))+t,lr=(a,b)=>{const sp=W-a.length-b.length;return sp>0?a+' '.repeat(sp)+b:a+' '+b};
  const L=[ctr('NY AKAMA'),ctr('Rhum arrangé'),ctr('Madagascar'),'-'.repeat(W),
    lr('Reçu n° '+String(s.no).padStart(4,'0'),''),new Date(s.ts).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}),
    'Vente en '+(s.mode==='gros'?'gros':'détail')];
  if(s.client)L.push('Client : '+s.client);
  L.push('-'.repeat(W));
  s.lines.forEach(l=>{L.push(l.nom.length>W?l.nom.slice(0,W):l.nom);L.push(lr('  '+l.qty+' x '+nf.format(l.pu),nf.format(l.qty*l.pu)))});
  L.push('-'.repeat(W));if(s.remise>0)L.push(lr('Sous-total',nf.format(s.total+s.remise)+' Ar'),lr('Remise','-'+nf.format(s.remise)+' Ar'));L.push(lr('TOTAL',nf.format(s.total)+' Ar'));
  if(s.pay)L.push(lr('Paiement',s.pay));
  if(s.recu>0&&s.pay==='Espèces'){L.push(lr('Reçu',nf.format(s.recu)+' Ar'),lr('Rendu',nf.format(Math.max(0,s.recu-s.total))+' Ar'))}
  if(s.vendeur||s.signature)L.push('Vendeur : '+(s.vendeur||'-'));if(s.signature)L.push('Signature : '+s.signature);L.push('-'.repeat(W),ctr('Misaotra tompoko !'),ctr('Merci de votre visite'),'','');
  return L.join('\n');
}

    const l=lots[0],line={lotId:l.id,jarId:l.jarId,f:l.f,nom:lotName(l),parfum:l.parfum,qty:1,pu:num(l.prixDetail),cu:num(l.cout)};
    put('lots',l.id,{...l,qty:num(l.qty)-1});
    const sid=uid();put('sales',sid,{id:sid,no:1,ts:Date.now()-864e5,date:addDays(-1),mode:'detail',client:'Exemple',pay:'Espèces',recu:line.pu,lines:[line],total:line.pu,cout:line.cu,ben:line.pu-line.cu,marge:line.pu>0?(line.pu-line.cu)/line.pu*100:0,ex:true});
  }
  commitDirect({parfum:'Popok',f:'70',qty:15,cout:6000,pd:12500,pg:10000,date:addDays(-5),photo:'',ex:true});
  closeSheet();UI.tab='home';render();toast('Exemple chargé : vous pouvez l\'effacer dans les réglages');
}
function clearSample(btn){
  if(btn.dataset.armed!=='1'){btn.dataset.armed='1';btn.textContent='Confirmer';return}
  ['jars','bottlings','lots','sales'].forEach(c=>Object.values(S[c]).filter(o=>o.ex).forEach(o=>del(c,o.id)));
  closeSheet();render();toast('Exemples effacés');
}

  'jar-refill':d=>openJarForm(d.id,true),

  'prod-step':d=>stepProd(d.id,parseInt(d.d,10)),
  'role-com':()=>{const w=$('#sheet');if(!w)return;if(val(w,'c_pin').trim().length<4){toast("Entrez d'abord un code gérant d'au moins 4 caractères.");return}saveCfg(true)},
  unlock:()=>openUnlock(),
  'unlock-ok':()=>doUnlock()
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const COM_OK=['tab','close','filter','mode','cart','cart-open','cart-rm','cart-clear','checkout','sale-save','sale-view','r-copy','r-save','unlock','unlock-ok'];
  if(isCom()&&!COM_OK.includes(el.dataset.act))return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset,el)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='q'){const v=e.target.value,p=e.target.selectionStart;UI.q=v;render();const i=$('#q');if(i){i.focus();try{i.setSelectionRange(p,p)}catch(x){}}}});
